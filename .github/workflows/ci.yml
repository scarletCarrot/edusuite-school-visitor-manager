name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit tests, then *IT integration tests against PostgreSQL in Testcontainers.
      - run: ./mvnw -B verify
        working-directory: backend

  e2e:
    name: End-to-end tests (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Builds and starts the whole stack with docker compose, then runs the browser tests.
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
